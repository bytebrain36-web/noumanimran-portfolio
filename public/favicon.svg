<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070b" />
      <stop offset="100%" stop-color="#0d1424" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Hexagon / Cyber Shield -->
  <rect x="6" y="6" width="88" height="88" rx="20" fill="url(#bgGrad)" stroke="#00ff66" stroke-opacity="0.3" stroke-width="2" />
  
  <!-- Subtle Grid Pattern in background -->
  <line x1="6" y1="50" x2="94" y2="50" stroke="#00ff66" stroke-opacity="0.1" stroke-width="1" />
  <line x1="50" y1="6" x2="50" y2="94" stroke="#00ff66" stroke-opacity="0.1" stroke-width="1" />

  <!-- N // I Monogram -->
  <g filter="url(#neonGlow)">
    <!-- Letter N -->
    <path d="M 24 70 L 24 30 L 44 70 L 44 30" fill="none" stroke="url(#neonGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Cyber Slash // -->
    <line x1="52" y1="68" x2="60" y2="32" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9" />
    <!-- Letter I -->
    <path d="M 72 30 L 72 70" fill="none" stroke="#00ff66" stroke-width="5.5" stroke-linecap="round" />
  </g>

  <!-- Corner Tech Accent Dot -->
  <circle cx="82" cy="18" r="3" fill="#00ff66" />
</svg>